[project]
name = "barber-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<7.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "psycopg2-binary>=2.9.9; sys_platform == 'linux'",
    "psycopg-binary>=3.1.18",
    "psycopg>=3.1.18",
    "python-dotenv>=1.0.0",
    "asgiref>=3.8.0",
    "sqlparse>=0.5.0",
    "requests>=2.31.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_python_implementation == 'CPython'",
]

